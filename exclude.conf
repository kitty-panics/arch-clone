# rsync excludes file for arch-clone

# /
- /dev/*
- /lost+found/*
- /media/*
- /mnt/*
- /proc/*
- /run/*
- /sys/*
- /tmp/*

# etc
- /etc/NetworkManager/system-connections/*
- /etc/pacman.d/gnupg/*
- /etc/ssh/ssh_host_*
- /etc/mtab
#- /etc/fstab
- /etc/fstab.bak
- /etc/machine-id
- /etc/machine-id.bak
- /etc/mtab

# home
# ---- cache
- /home/*/.cache/*
# ---- config
- /home/*/.config/chromium
- /home/*/.config/dconf
- /home/*/.config/fcitx
- /home/*/.config/gtk-3.0
- /home/*/.config/ibus
- /home/*/.config/ibus
- /home/*/.config/procps
- /home/*/.config/pulse
- /home/*/.config/xfce4/desktop/icons.screen0*
# ---- local
- /home/*/.local/share/fcitx5/rime/pinyin.userdb
- /home/*/.local/share/fcitx5/rime/sync
- /home/*/.local/share/fcitx5/rime/installation.yaml
- /home/*/.local/share/fcitx5/rime/user.yaml
- /home/*/.local/share/Mousepad
- /home/*/.local/share/pki
- /home/*/.local/share/ranger
- /home/*/.local/share/ristretto
- /home/*/.local/share/Trash
- /home/*/.local/share/recently-used.xbel*
- /home/*/.local/state
# ---- root
- /home/*/.gnupg
- /home/*/.live
- /home/*/.ssh/agent
- /home/*/.bash_history
- /home/*/.ICEauthority
- /home/*/.vboxclient-*.pid
- /home/*/.viminfo
- /home/*/.Xauthority
- /home/*/.xsession-errors
- /home/*/.xsession-errors.old
- /home/*/.zcompdump
- /home/*/.zdirs
- /home/*/.zsh_history

# root
+ /root/
+ /root/.ssh/
+ /root/.ssh/**
- /root/**

# usr
#+ /usr/share/locale/
#+ /usr/share/locale/en_US/
#+ /usr/share/locale/en_US/**
#+ /usr/share/locale/zh_CN/
#+ /usr/share/locale/zh_CN/**
#+ /usr/share/locale/locale.alias
#- /usr/share/locale/**

# var
+ /var/
+ /var/lib/
+ /var/lib/pacman/
+ /var/lib/pacman/local/
+ /var/lib/pacman/local/**
+ /var/.updated
- /var/**
