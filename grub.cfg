search --no-floppy --file --set=root /boot/grub/grub.cfg
set prefix=($root)/boot/grub

insmod all_video
insmod gfxterm
insmod gfxmenu
insmod jpeg
insmod png

set gfxmode=1024x768,800x600,640x480,auto
terminal_output gfxterm

set theme=$prefix/themes/Vimix/theme.txt
export theme

set timeout=15
set default=0

menuentry "${DISTRO} (Copy to RAM)" --class arch --hotkey=1 {
    set gfxpayload=keep
    echo "Loading kernel..."
    linux  /arch/boot/x86_64/${kernel_image} archisobasedir=arch archisolabel=${volid} copytoram=y cow_spacesize=75%
    echo "Loading initial ramdisk..."
    initrd /arch/boot/x86_64/${initrd_image}
}

menuentry "${DISTRO} (Boot from USB)" --class arch --hotkey=2 {
    set gfxpayload=keep
    echo "Loading kernel..."
    linux  /arch/boot/x86_64/${kernel_image} archisobasedir=arch archisolabel=${volid}
    echo "Loading initial ramdisk..."
    initrd /arch/boot/x86_64/${initrd_image}
}
