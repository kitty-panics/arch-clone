search --file --set=root /boot/grub/grub.cfg
set prefix=($root)/boot/grub

insmod all_video
insmod gfxterm
insmod gfxmenu
insmod jpeg
insmod png

if loadfont $prefix/fonts/unicode.pf2 ; then
  set gfxmode=1024x768,800x600,640x480,auto
  terminal_output gfxterm
fi

set theme=$prefix/themes/Vimix/theme.txt
export theme

set timeout=15
set default=0

menuentry "${DISTRO} (boot from RAM)" --class arch --hotkey=1 {
    set gfxpayload=keep
    linux   /arch/boot/x86_64/${kernel_image} archisobasedir=arch boot=live components archisolabel=${volid} copytoram=y cow_spacesize=75%
    initrd  /arch/boot/x86_64/${initrd_image}
}

menuentry "${DISTRO} (boot from USB)" --class arch --hotkey=2 {
    set gfxpayload=keep
    linux   /arch/boot/x86_64/${kernel_image} archisobasedir=arch boot=live components archisolabel=${volid}
    initrd  /arch/boot/x86_64/${initrd_image}
}
